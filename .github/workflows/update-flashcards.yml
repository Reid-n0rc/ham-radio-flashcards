name: Update flash cards

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update-flashcards.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-flashcards
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/russolsen/ham_radio_question_pool.git

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for release versioning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          pip install -r requirements.txt

      - name: Fetch upstream pool data
        id: upstream
        run: |
          git clone --depth 1 "$UPSTREAM" "$RUNNER_TEMP/upstream"
          echo "sha=$(git -C "$RUNNER_TEMP/upstream" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync current pools
        run: |
          python scripts/sync_pools.py "$RUNNER_TEMP/upstream" pools
          echo "${{ steps.upstream.outputs.sha }}" > pools/UPSTREAM_COMMIT

      - name: Check NCVEC for releases and errata
        id: ncvec
        run: python scripts/check_ncvec.py ncvec

      - name: Build flash cards
        run: python scripts/build.py

      - name: Build website
        run: python scripts/build_site.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pools cards ncvec docs
          if git diff --cached --quiet; then
            echo "No changes."
            echo "cards_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^cards/.*\.pdf$'; then
            echo "cards_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cards_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --stat
          git commit -m "Update flash cards (upstream ${{ steps.upstream.outputs.sha }})"
          git push

      - name: Publish release
        if: steps.commit.outputs.cards_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          tag="v${major:-0}.${minor:-1}.$(( ${patch:-0} + 1 ))"
          gh release create "$tag" cards/*.pdf --target "$(git rev-parse HEAD)" \
            --title "$tag" --notes-file cards/README.md

      - name: Open issue for NCVEC changes
        if: steps.ncvec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "$RUNNER_TEMP/NCVEC_CHANGES.md"
            echo
            echo "Questions NCVEC lists as withdrawn are already excluded from the cards."
            echo "Wording or answer changes need the upstream data to catch up; review the cards once it does."
            echo
            echo "Cards rebuilt this run: ${{ steps.commit.outputs.cards_changed }}"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "NCVEC question pool change detected $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/issue.md"
